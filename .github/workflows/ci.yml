name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Build (with the Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
      - name: Axioms of every declaration
        run: lake env lean scripts/CheckAxioms.lean
      - name: Kernel replay (leanchecker)
        run: lake env leanchecker Hironaka
